[terminal.shell]
program = "C:\\msys64\\usr\\bin\\bash.exe"
args = ["--login", "-c", "\"exec tmux new-session -A -s main -c $(cygpath $USERPROFILE)\""]

[env]
MSYSTEM = "MINGW64"
CHERE_INVOKING = "1"
MSYS2_PATH_TYPE = "inherit"
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 4 }

[selection]
save_to_clipboard = true

[font]
size = 12.0
normal = { family = "MesloLGS NF", style = "Regular" }
bold = { family = "MesloLGS NF", style = "Bold" }
italic = { family = "MesloLGS NF", style = "Italic" }
