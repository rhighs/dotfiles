[general]
working_directory = "C:\\Users\\rober"

# msys2 login bash (MINGW64, inheriting windows PATH) straight into tmux
# alacritty joins args unquoted on windows, so -c needs its own quotes
[terminal.shell]
program = "C:\\msys64\\usr\\bin\\bash.exe"
args = ["--login", "-c", "\"exec tmux new-session -A -s main\""]

[env]
MSYSTEM = "MINGW64"
CHERE_INVOKING = "1"
MSYS2_PATH_TYPE = "inherit"
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 4 }

[selection]
save_to_clipboard = true

[font]
size = 12.0

# MesloLGS NF stands in for Menlo on windows
[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[font.normal]
family = "MesloLGS NF"
style = "Regular"

# ==========================================
# ================= THEMES =================
# ==========================================

[colors.primary]
foreground = "#c0c5ce"
background = "#2a2d37"

[colors.cursor]
text = "#2a2d37"
