# Make it use C-a, similar to GNU screen
#unbind C-b
#set -g prefix C-a

# tmux-256color when terminfo has it (older macOS ncurses lacks it)
if-shell "infocmp tmux-256color >/dev/null 2>&1" "set -g default-terminal tmux-256color" "set -g default-terminal screen-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"
set -g focus-events on
set -g history-limit 50000

set -g mouse on
setw -g mode-keys vi
set-option -g set-clipboard on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "cat > /dev/clipboard"

# THEME
set -g status-bg colour235
set -g status-fg yellow

set -g status-interval 60
set -sg escape-time 10
set-option -g base-index 1
setw -g aggressive-resize on
set -g status-justify centre
set -g status-left-length 70
set -g status-left "#[fg=yellow]#(ipconfig | grep IPv4 | grep -v 169.254 | head -n 1 | awk '{print \"Local \" \$NF}')"
set -g status-right-length 60
set -g status-right "#[fg=blue]#S #I:#P #[fg=yellow]:: %d %b %Y #[fg=green]:: %l:%M %p :: #(date -u | awk '{print $4}')::"

# and use C-h and C-l to cycle thru panes
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize window with alt arrow keys
bind-key -n C-S-Up resize-pane -U 10
bind-key -n C-S-Down resize-pane -D 10
bind-key -n C-S-Left resize-pane -L 10
bind-key -n C-S-Right resize-pane -R 10
