[general]
import = ["~/.config/alacritty/theme.toml"]

[terminal.shell]
program = "/bin/bash"
args = ["--login"]

[font]
size = 8.0
normal = { family = "Source Code Pro", style = "Regular" }
bold = { family = "Source Code Pro", style = "Bold" }
italic = { family = "Source Code Pro", style = "Italic" }

[env]
LANG = "C.UTF-8"
LC_CTYPE = "C.UTF-8"
