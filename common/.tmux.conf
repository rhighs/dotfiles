if "infocmp tmux-256color >/dev/null 2>&1" "set -g default-terminal tmux-256color" "set -g default-terminal screen-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"
set -g focus-events on
set -g history-limit 50000
set -sg escape-time 10
set -g extended-keys on
set -g mouse on
set -g base-index 1
setw -g aggressive-resize on
setw -g mode-keys vi

set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
if "command -v pbcopy >/dev/null" "set -s copy-command pbcopy"
if "command -v wl-copy >/dev/null" "set -s copy-command wl-copy"
if "[ -e /dev/clipboard ]" "set -s copy-command 'cat > /dev/clipboard'"
if '[ -n "$MSYSTEM" ]' "set-environment -g CHERE_INVOKING 1"

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind -n C-S-Up resize-pane -U 10
bind -n C-S-Down resize-pane -D 10
bind -n C-S-Left resize-pane -L 10
bind -n C-S-Right resize-pane -R 10

set -g status-interval 60
set -g status-bg colour235
set -g status-fg yellow
set -g status-justify centre
set -g status-left-length 70
set -g status-right-length 60
set -g status-left "#[fg=yellow]#(command -v ifconfig >/dev/null && ifconfig | awk '/inet / && $2 != \"127.0.0.1\" {print \"Local \" $2}' || ipconfig | awk '/IPv4/ && \$NF !~ /^169/ {print \"Local \" \$NF; exit}')"
set -g status-right "#[fg=blue]#S #I:#P #[fg=yellow]:: %d %b %Y #[fg=green]:: %l:%M %p :: #(date -u | awk '{print $4}')::"

if "[ -d /opt/homebrew/bin ]" 'set-environment -g PATH "/opt/homebrew/bin:$PATH"'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
